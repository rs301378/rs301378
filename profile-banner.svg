<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1520"/>
      <stop offset="100%" stop-color="#0D1E2E"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1B2A3A" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a5670"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="300" fill="none" stroke="#1B2A3A" stroke-width="2"/>

  <!-- corner brackets -->
  <path d="M20,40 L20,20 L40,20" fill="none" stroke="#F2A65A" stroke-width="2"/>
  <path d="M1160,20 L1180,20 L1180,40" fill="none" stroke="#F2A65A" stroke-width="2"/>
  <path d="M20,260 L20,280 L40,280" fill="none" stroke="#5FD3C4" stroke-width="2"/>
  <path d="M1180,260 L1180,280 L1160,280" fill="none" stroke="#5FD3C4" stroke-width="2"/>

  <!-- left: text -->
  <text x="60" y="118" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" fill="#5FD3C4" letter-spacing="2">// DATA ENGINEER</text>
  <text x="60" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="#E7EEF5">Rohit Sharma</text>
  <text x="60" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#90A6BA">Batch pipelines &#183; Spark &#183; Databricks &#183; Cloud Lakehouses</text>
  <text x="60" y="236" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#5C7185" letter-spacing="1">gurgaon, india &#183; open to remote &amp; hybrid</text>

  <!-- right: mini DAG graphic -->
  <g transform="translate(760,60)">
    <!-- edges -->
    <path d="M20,40 C60,40 60,95 100,95" fill="none" stroke="#3a5670" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M20,95 L100,95" fill="none" stroke="#3a5670" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M20,150 C60,150 60,95 100,95" fill="none" stroke="#3a5670" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M170,95 L230,95" fill="none" stroke="#3a5670" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M300,95 C330,95 330,45 360,45" fill="none" stroke="#3a5670" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M300,95 C330,95 330,145 360,145" fill="none" stroke="#3a5670" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- source nodes -->
    <rect x="0" y="24" width="42" height="32" rx="4" fill="#101E2E" stroke="#2B4A63"/>
    <rect x="0" y="79" width="42" height="32" rx="4" fill="#101E2E" stroke="#2B4A63"/>
    <rect x="0" y="134" width="42" height="32" rx="4" fill="#101E2E" stroke="#2B4A63"/>

    <!-- transform node -->
    <rect x="100" y="72" width="70" height="46" rx="5" fill="#101E2E" stroke="#F2A65A" stroke-width="1.6"/>
    <text x="135" y="99" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E7EEF5" text-anchor="middle">SPARK</text>

    <!-- output nodes -->
    <rect x="360" y="24" width="46" height="32" rx="4" fill="#101E2E" stroke="#5FD3C4"/>
    <rect x="360" y="129" width="46" height="32" rx="4" fill="#101E2E" stroke="#5FD3C4"/>

    <!-- flow dots -->
    <circle cx="60" cy="68" r="3" fill="#F2A65A"/>
    <circle cx="200" cy="95" r="3" fill="#F2A65A"/>
    <circle cx="330" cy="70" r="3" fill="#5FD3C4"/>
  </g>

  <text x="1140" y="285" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5670" text-anchor="end">batch &#183; scheduled &#183; idempotent</text>
</svg>
